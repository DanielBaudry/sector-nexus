<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNova" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081e28"/>
      <stop offset="100%" stop-color="#030c12"/>
    </linearGradient>
    <linearGradient id="ghostSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glowNova">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="20" fill="url(#bgNova)"/>
  <rect x="6" y="6" width="188" height="188" rx="16" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Ghost Suit Shoulders & High Collar -->
  <path d="M 35 185 L 60 145 L 80 155 L 75 195 Z" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
  <path d="M 165 185 L 140 145 L 120 155 L 125 195 Z" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
  <path d="M 75 155 L 100 168 L 125 155 L 135 195 L 65 195 Z" fill="#0e2a36" stroke="#06b6d4" stroke-width="2"/>

  <!-- Psionic Energy Lines on Collar -->
  <line x1="85" y1="165" x2="100" y2="185" stroke="#22d3ee" stroke-width="2" filter="url(#glowNova)"/>
  <line x1="115" y1="165" x2="100" y2="185" stroke="#22d3ee" stroke-width="2" filter="url(#glowNova)"/>

  <!-- Ponytail in Background -->
  <path d="M 125 70 C 170 85, 175 140, 150 170 C 160 140, 155 95, 120 75 Z" fill="url(#hairGrad)"/>

  <!-- Head & Face -->
  <path d="M 75 90 C 75 55, 125 55, 125 90 C 125 125, 115 140, 100 145 C 85 140, 75 125, 75 90 Z" fill="#fde68a" opacity="0.95"/>

  <!-- Sleek Hair Fringe -->
  <path d="M 68 85 C 72 45, 128 45, 132 85 C 120 70, 95 65, 78 78 Z" fill="url(#hairGrad)"/>
  <path d="M 72 75 C 85 90, 85 115, 82 125 C 80 110, 75 95, 70 85 Z" fill="url(#hairGrad)"/>

  <!-- Ghost Tactical Ocular Monocle (Left Eye) -->
  <circle cx="112" cy="95" r="10" fill="#083344" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="112" cy="95" r="6" fill="#06b6d4" filter="url(#glowNova)"/>
  <circle cx="112" cy="95" r="2.5" fill="#ffffff"/>
  <line x1="122" y1="95" x2="135" y2="92" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- Right Eye (Human Pupil) -->
  <ellipse cx="88" cy="96" rx="4.5" ry="3" fill="#0e7490"/>
  <circle cx="89" cy="95" r="1.5" fill="#ffffff"/>

  <!-- Lip & Nose Subtle Shading -->
  <path d="M 98 105 L 100 112 L 96 114" stroke="#d97706" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 95 125 Q 100 128 105 125" stroke="#be185d" stroke-width="2" fill="none"/>

  <!-- Stealth Cloak Particle Dots -->
  <circle cx="45" cy="65" r="2" fill="#22d3ee" opacity="0.7" filter="url(#glowNova)"/>
  <circle cx="160" cy="55" r="2.5" fill="#22d3ee" opacity="0.8" filter="url(#glowNova)"/>
  <circle cx="170" cy="110" r="1.5" fill="#22d3ee" opacity="0.6"/>

  <!-- Faction Accent Badge -->
  <rect x="14" y="14" width="34" height="14" rx="4" fill="#0e7490" fill-opacity="0.6" stroke="#22d3ee" stroke-width="1"/>
  <text x="31" y="24" font-family="'Orbitron', sans-serif" font-size="8" font-weight="bold" fill="#cffafe" text-anchor="middle">GHOST</text>
</svg>
