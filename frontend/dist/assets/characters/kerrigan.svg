<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKerrigan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240c38"/>
      <stop offset="100%" stop-color="#090210"/>
    </linearGradient>
    <linearGradient id="chitinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="bioWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <filter id="glowZerg">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="20" fill="url(#bgKerrigan)"/>
  <rect x="6" y="6" width="188" height="188" rx="16" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Segmented Bone Wings in Background -->
  <!-- Left Wing -->
  <path d="M 50 150 C 30 110, 10 70, 20 40 C 35 60, 45 90, 60 120 Z" fill="url(#bioWing)" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 60 140 C 40 100, 25 50, 45 25 C 55 50, 65 85, 75 115 Z" fill="url(#bioWing)" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 70 145 C 60 110, 50 70, 70 45 C 75 75, 80 100, 85 125 Z" fill="url(#bioWing)" stroke="#c084fc" stroke-width="1.5"/>

  <!-- Right Wing -->
  <path d="M 150 150 C 170 110, 190 70, 180 40 C 165 60, 155 90, 140 120 Z" fill="url(#bioWing)" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 140 140 C 160 100, 175 50, 155 25 C 145 50, 135 85, 125 115 Z" fill="url(#bioWing)" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 130 145 C 140 110, 150 70, 130 45 C 125 75, 120 100, 115 125 Z" fill="url(#bioWing)" stroke="#c084fc" stroke-width="1.5"/>

  <!-- Chitin Carapace Shoulders & Collar -->
  <path d="M 45 185 L 70 145 L 85 160 L 75 195 Z" fill="url(#chitinGrad)" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 155 185 L 130 145 L 115 160 L 125 195 Z" fill="url(#chitinGrad)" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 75 160 L 100 175 L 125 160 L 135 195 L 65 195 Z" fill="#2e1065" stroke="#9333ea" stroke-width="2"/>

  <!-- Psionic Veins on Chest -->
  <path d="M 100 175 L 88 190 M 100 175 L 112 190" stroke="#f43f5e" stroke-width="2" filter="url(#glowZerg)"/>

  <!-- Head (Pale/Ash Violet Skin) -->
  <path d="M 72 90 C 72 50, 128 50, 128 90 C 128 125, 118 142, 100 148 C 82 142, 72 125, 72 90 Z" fill="#cbd5e1"/>

  <!-- Segmented Dreadlock Tendrils (Zerg Bio-Hair) -->
  <path d="M 68 85 C 55 100, 50 140, 62 165 C 66 140, 68 105, 75 90 Z" fill="#581c87" stroke="#9333ea" stroke-width="1"/>
  <path d="M 132 85 C 145 100, 150 140, 138 165 C 134 140, 132 105, 125 90 Z" fill="#581c87" stroke="#9333ea" stroke-width="1"/>
  <path d="M 70 65 C 60 75, 55 110, 68 135" stroke="#c084fc" stroke-width="2" fill="none"/>
  <path d="M 130 65 C 140 75, 145 110, 132 135" stroke="#c084fc" stroke-width="2" fill="none"/>

  <!-- Chitin Crown Horns / Brow Spikes -->
  <path d="M 75 68 L 100 58 L 125 68 L 115 78 L 100 70 L 85 78 Z" fill="#3b0764" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 92 58 L 100 42 L 108 58 Z" fill="#9333ea" stroke="#e879f9" stroke-width="1.5" filter="url(#glowZerg)"/>

  <!-- Glowing Yellow/Amber Bio Eyes with Violet Aura -->
  <ellipse cx="88" cy="95" rx="5" ry="3.5" fill="#facc15" filter="url(#glowZerg)"/>
  <ellipse cx="112" cy="95" rx="5" ry="3.5" fill="#facc15" filter="url(#glowZerg)"/>
  <circle cx="88" cy="95" r="1.5" fill="#ffffff"/>
  <circle cx="112" cy="95" r="1.5" fill="#ffffff"/>

  <!-- Dark Lips & Chitin Cheek Plates -->
  <path d="M 76 105 L 82 120" stroke="#7e22ce" stroke-width="1.5"/>
  <path d="M 124 105 L 118 120" stroke="#7e22ce" stroke-width="1.5"/>
  <path d="M 94 126 Q 100 130 106 126" stroke="#4c0519" stroke-width="2.5" fill="none"/>

  <!-- Faction Accent Badge -->
  <rect x="14" y="14" width="34" height="14" rx="4" fill="#581c87" fill-opacity="0.8" stroke="#c084fc" stroke-width="1"/>
  <text x="31" y="24" font-family="'Orbitron', sans-serif" font-size="8" font-weight="bold" fill="#f5d0fe" text-anchor="middle">SWARM</text>
</svg>
