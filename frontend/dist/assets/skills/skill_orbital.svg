<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="beamGlow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="12" fill="#040b18"/>
  <rect x="3" y="3" width="94" height="94" rx="9" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Orbital Targeting Reticle -->
  <circle cx="50" cy="72" r="22" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="50" cy="72" r="14" fill="none" stroke="#ef4444" stroke-width="1.5"/>

  <!-- Descending Particle Rays -->
  <line x1="38" y1="5" x2="45" y2="70" stroke="#7dd3fc" stroke-width="1" opacity="0.6"/>
  <line x1="62" y1="5" x2="55" y2="70" stroke="#7dd3fc" stroke-width="1" opacity="0.6"/>

  <!-- Massive Central Orbital Beam -->
  <polygon points="46,5 54,5 58,72 42,72" fill="url(#beamGrad)" filter="url(#beamGlow)"/>
  <line x1="50" y1="5" x2="50" y2="72" stroke="#ffffff" stroke-width="3" filter="url(#beamGlow)"/>

  <!-- Impact Blast Radius -->
  <ellipse cx="50" cy="74" rx="28" ry="8" fill="#38bdf8" filter="url(#beamGlow)" opacity="0.8"/>
  <ellipse cx="50" cy="74" rx="16" ry="4" fill="#ffffff" filter="url(#beamGlow)"/>
</svg>
