<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shieldGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="12" fill="#040e1f"/>
  <rect x="3" y="3" width="94" height="94" rx="9" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Energy Hexagon Barrier Grid -->
  <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Solid Hardlight Tactical Shield -->
  <path d="M 50 24 C 65 24, 75 30, 75 48 C 75 66, 62 76, 50 82 C 38 76, 25 66, 25 48 C 25 30, 35 24, 50 24 Z" fill="url(#shieldGrad)" stroke="#7dd3fc" stroke-width="2" filter="url(#shieldGlow)"/>

  <!-- Inner Chevron Emblems -->
  <path d="M 40 42 L 50 50 L 60 42" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 42 52 L 50 58 L 58 52" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
