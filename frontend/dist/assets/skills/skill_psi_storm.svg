<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="stormGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="12" fill="#140624"/>
  <rect x="3" y="3" width="94" height="94" rx="9" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Swirling Maelstrom Rings -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#9333ea" stroke-width="1" stroke-dasharray="8 4"/>
  <circle cx="50" cy="50" r="24" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Psionic Lightning Bolts -->
  <path d="M 46 14 L 56 36 L 42 45 L 62 68 L 38 72 L 54 90" stroke="#f472b6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#stormGlow)"/>
  <path d="M 46 14 L 56 36 L 42 45 L 62 68 L 38 72 L 54 90" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fork Arcs -->
  <path d="M 42 45 L 24 52" stroke="#e879f9" stroke-width="1.5" fill="none" filter="url(#stormGlow)"/>
  <path d="M 62 68 L 78 60" stroke="#e879f9" stroke-width="1.5" fill="none" filter="url(#stormGlow)"/>
  <circle cx="50" cy="50" r="8" fill="#a855f7" filter="url(#stormGlow)"/>
</svg>
