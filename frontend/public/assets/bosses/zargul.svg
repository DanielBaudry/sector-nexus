<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Zar'gul, the World Eater">
  <defs>
    <radialGradient id="glow" cx="50%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#ff7a1a" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7c1d0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b2a3a"/>
      <stop offset="55%" stop-color="#2a1020"/>
      <stop offset="100%" stop-color="#12060c"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a3b47"/>
      <stop offset="100%" stop-color="#2b0f1c"/>
    </linearGradient>
    <radialGradient id="maw" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="25%" stop-color="#ff6a00"/>
      <stop offset="65%" stop-color="#8a1405"/>
      <stop offset="100%" stop-color="#1a0202"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c2"/>
      <stop offset="45%" stop-color="#ffb21a"/>
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="140" rx="160" ry="100" fill="url(#glow)"/>

  <!-- Back spines -->
  <g fill="#2a0f1b" stroke="#ff7a1a" stroke-opacity="0.35" stroke-width="1.2">
    <path d="M70 92 L52 22 L92 80 Z"/>
    <path d="M104 72 L98 6 L128 64 Z"/>
    <path d="M146 62 L160 0 L174 62 Z"/>
    <path d="M192 64 L222 6 L216 72 Z"/>
    <path d="M228 80 L268 22 L250 92 Z"/>
  </g>

  <!-- Side claws / tusks -->
  <g fill="#e8d5b5" stroke="#5b2a3a" stroke-width="1.5">
    <path d="M38 150 C10 170 4 205 22 232 C26 210 40 188 64 176 Z"/>
    <path d="M282 150 C310 170 316 205 298 232 C294 210 280 188 256 176 Z"/>
  </g>

  <!-- Carapace head -->
  <path d="M40 140 C40 82 96 52 160 52 C224 52 280 82 280 140 C280 168 262 188 238 198 L82 198 C58 188 40 168 40 140 Z"
        fill="url(#shell)" stroke="#ff8a3d" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Armor plates -->
  <g fill="url(#plate)" stroke="#ff9a52" stroke-opacity="0.35" stroke-width="1.2">
    <path d="M86 84 C104 66 132 60 160 60 C188 60 216 66 234 84 C210 80 186 78 160 78 C134 78 110 80 86 84 Z"/>
    <path d="M62 116 C74 96 96 88 118 88 L110 108 C92 108 76 112 62 116 Z"/>
    <path d="M258 116 C246 96 224 88 202 88 L210 108 C228 108 244 112 258 116 Z"/>
    <path d="M128 86 L160 82 L192 86 L184 100 L160 98 L136 100 Z"/>
  </g>

  <!-- Eyes -->
  <g>
    <circle cx="110" cy="112" r="11" fill="url(#eye)" filter="url(#soft)"/>
    <circle cx="210" cy="112" r="11" fill="url(#eye)" filter="url(#soft)"/>
    <circle cx="110" cy="112" r="4" fill="#fff4b8"/>
    <circle cx="210" cy="112" r="4" fill="#fff4b8"/>
    <circle cx="88" cy="126" r="6" fill="url(#eye)" filter="url(#soft)"/>
    <circle cx="232" cy="126" r="6" fill="url(#eye)" filter="url(#soft)"/>
    <circle cx="88" cy="126" r="2.2" fill="#fff4b8"/>
    <circle cx="232" cy="126" r="2.2" fill="#fff4b8"/>
    <circle cx="140" cy="104" r="4" fill="url(#eye)"/>
    <circle cx="180" cy="104" r="4" fill="url(#eye)"/>
  </g>

  <!-- Maw -->
  <path d="M84 150 C100 130 130 124 160 124 C190 124 220 130 236 150 C226 196 196 226 160 228 C124 226 94 196 84 150 Z"
        fill="url(#maw)" stroke="#3a0a0a" stroke-width="2"/>
  <ellipse cx="160" cy="172" rx="34" ry="26" fill="#ffe08a" opacity="0.35" filter="url(#soft)"/>

  <!-- Upper teeth -->
  <g fill="#f3e6cc" stroke="#6b3a2a" stroke-width="0.8">
    <path d="M94 148 L102 172 L110 142 Z"/>
    <path d="M112 140 L120 170 L128 137 Z"/>
    <path d="M130 135 L139 168 L146 133 Z"/>
    <path d="M150 132 L160 170 L170 132 Z"/>
    <path d="M174 133 L181 168 L190 135 Z"/>
    <path d="M192 137 L200 170 L208 140 Z"/>
    <path d="M210 142 L218 172 L226 148 Z"/>
  </g>
  <!-- Lower teeth -->
  <g fill="#e9d8b8" stroke="#6b3a2a" stroke-width="0.8">
    <path d="M108 200 L118 180 L124 210 Z"/>
    <path d="M128 212 L138 186 L144 218 Z"/>
    <path d="M150 220 L160 190 L170 220 Z"/>
    <path d="M176 218 L182 186 L192 212 Z"/>
    <path d="M196 210 L202 180 L212 200 Z"/>
  </g>

  <!-- Drool of magma -->
  <g fill="#ff8a1a" opacity="0.85">
    <path d="M152 226 C150 232 154 238 156 240 C158 236 158 230 156 226 Z"/>
    <path d="M176 222 C175 228 178 232 180 234 C181 230 180 225 178 222 Z"/>
  </g>
</svg>
