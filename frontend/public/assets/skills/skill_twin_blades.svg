<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="bladeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="12" fill="#061220"/>
  <rect x="3" y="3" width="94" height="94" rx="9" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Crossed Warp Blades -->
  <!-- Left Blade -->
  <path d="M 18 82 L 40 55 L 78 18 L 65 35 L 35 65 Z" fill="url(#bladeGrad)" filter="url(#bladeGlow)"/>
  <!-- Right Blade -->
  <path d="M 82 82 L 60 55 L 22 18 L 35 35 L 65 65 Z" fill="url(#bladeGrad)" filter="url(#bladeGlow)"/>

  <!-- Core Hilts & Spark Center -->
  <circle cx="50" cy="50" r="7" fill="#ffffff" filter="url(#bladeGlow)"/>
  <polygon points="50,42 54,48 60,50 54,52 50,58 46,52 40,50 46,48" fill="#67e8f9"/>
</svg>
