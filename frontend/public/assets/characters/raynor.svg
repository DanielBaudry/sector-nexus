<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07152d"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="armorMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="visorGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hex Background & Frame -->
  <rect width="200" height="200" rx="20" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="188" height="188" rx="16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>

  <!-- Pauldrons (Heavy Neosteel Armor) -->
  <path d="M 25 180 L 45 130 L 80 145 L 85 190 Z" fill="url(#armorMetal)" stroke="#7dd3fc" stroke-width="1.5"/>
  <path d="M 175 180 L 155 130 L 120 145 L 115 190 Z" fill="url(#armorMetal)" stroke="#7dd3fc" stroke-width="1.5"/>

  <!-- Chestplate Collar -->
  <path d="M 65 150 L 100 165 L 135 150 L 140 195 L 60 195 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="100" cy="175" r="8" fill="#0284c7" filter="url(#glow)"/>
  <line x1="80" y1="180" x2="120" y2="180" stroke="#7dd3fc" stroke-width="2"/>

  <!-- Marine Heavy Combat Helmet Base -->
  <path d="M 55 105 C 55 55, 145 55, 145 105 C 145 135, 135 150, 100 152 C 65 150, 55 135, 55 105 Z" fill="#1e293b" stroke="#0284c7" stroke-width="3"/>

  <!-- Brow Plate -->
  <path d="M 60 85 L 100 95 L 140 85 L 135 70 L 100 78 L 65 70 Z" fill="#334155" stroke="#7dd3fc" stroke-width="1"/>

  <!-- Glowing Tactical Visor -->
  <path d="M 68 95 C 80 102, 120 102, 132 95 C 136 108, 128 116, 100 118 C 72 116, 64 108, 68 95 Z" fill="url(#visorGlow)" filter="url(#glow)"/>
  <path d="M 75 99 Q 100 105 125 99" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.8"/>

  <!-- Respirator / Rebreather Grill -->
  <path d="M 85 125 L 115 125 L 110 145 L 90 145 Z" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="92" y1="130" x2="108" y2="130" stroke="#38bdf8" stroke-width="1"/>
  <line x1="94" y1="135" x2="106" y2="135" stroke="#38bdf8" stroke-width="1"/>
  <line x1="96" y1="140" x2="104" y2="140" stroke="#38bdf8" stroke-width="1"/>

  <!-- Comms Headset / Sensor Antenna -->
  <rect x="48" y="90" width="8" height="24" rx="3" fill="#0284c7"/>
  <line x1="50" y1="92" x2="35" y2="70" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="35" cy="70" r="3" fill="#ef4444" filter="url(#glow)"/>

  <!-- Skull / Marshal Stencil Logo on Helmet -->
  <path d="M 95 62 L 105 62 L 103 70 L 97 70 Z" fill="#94a3b8" opacity="0.6"/>
  <circle cx="97" cy="65" r="1.5" fill="#0f172a"/>
  <circle cx="103" cy="65" r="1.5" fill="#0f172a"/>

  <!-- Faction Accent Badge -->
  <rect x="14" y="14" width="34" height="14" rx="4" fill="#0369a1" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1"/>
  <text x="31" y="24" font-family="'Orbitron', sans-serif" font-size="8" font-weight="bold" fill="#e0f2fe" text-anchor="middle">TERRAN</text>
</svg>
