<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMedic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2318"/>
      <stop offset="100%" stop-color="#020d08"/>
    </linearGradient>
    <linearGradient id="whiteArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="healGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="glowHeal">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="20" fill="url(#bgMedic)"/>
  <rect x="6" y="6" width="188" height="188" rx="16" fill="none" stroke="#4ade80" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Heavy White/Red Medical Pauldrons -->
  <path d="M 25 180 L 45 130 L 80 145 L 85 190 Z" fill="url(#whiteArmor)" stroke="#ef4444" stroke-width="2"/>
  <path d="M 175 180 L 155 130 L 120 145 L 115 190 Z" fill="url(#whiteArmor)" stroke="#ef4444" stroke-width="2"/>

  <!-- Red Medical Cross on Left Shoulder -->
  <rect x="44" y="145" width="14" height="4" rx="1" fill="#ef4444"/>
  <rect x="49" y="140" width="4" height="14" rx="1" fill="#ef4444"/>

  <!-- Chestplate & Nanite Vital Dispenser -->
  <path d="M 65 150 L 100 165 L 135 150 L 140 195 L 60 195 Z" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
  <circle cx="100" cy="175" r="9" fill="url(#healGreen)" filter="url(#glowHeal)"/>
  <!-- Caduceus / Plus Icon in Core -->
  <rect x="96" y="173" width="8" height="4" fill="#ffffff"/>
  <rect x="98" y="171" width="4" height="8" fill="#ffffff"/>

  <!-- Medic Combat Helmet -->
  <path d="M 60 105 C 60 55, 140 55, 140 105 C 140 135, 130 150, 100 152 C 70 150, 60 135, 60 105 Z" fill="url(#whiteArmor)" stroke="#334155" stroke-width="2"/>

  <!-- Red Center Stripe on Helmet -->
  <path d="M 94 56 L 106 56 L 106 88 L 94 88 Z" fill="#ef4444"/>

  <!-- Glowing Emerald Medical HUD Visor -->
  <path d="M 70 95 C 80 100, 120 100, 130 95 C 134 108, 126 116, 100 118 C 74 116, 66 108, 70 95 Z" fill="#22c55e" filter="url(#glowHeal)"/>
  <path d="M 78 99 Q 100 104 122 99" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.8"/>

  <!-- Holographic ECG Wave on Visor -->
  <path d="M 85 106 L 93 106 L 96 100 L 99 112 L 103 103 L 106 106 L 115 106" stroke="#bbf7d0" stroke-width="1.2" fill="none"/>

  <!-- Nanite Filter Port -->
  <circle cx="80" cy="132" r="5" fill="#334155" stroke="#4ade80" stroke-width="1"/>
  <circle cx="120" cy="132" r="5" fill="#334155" stroke="#4ade80" stroke-width="1"/>
  <path d="M 92 135 L 108 135 L 104 145 L 96 145 Z" fill="#0f172a" stroke="#4ade80" stroke-width="1"/>

  <!-- Faction Accent Badge -->
  <rect x="14" y="14" width="34" height="14" rx="4" fill="#14532d" fill-opacity="0.8" stroke="#4ade80" stroke-width="1"/>
  <text x="31" y="24" font-family="'Orbitron', sans-serif" font-size="8" font-weight="bold" fill="#bbf7d0" text-anchor="middle">MEDIC</text>
</svg>
